{% load static %}
<style>
  .whatsapp-float{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:60;display:inline-flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border:1px solid rgba(255,255,255,.25);border-radius:18px;background:#25d366;color:#fff;font:800 15px/1.2 Arial,Helvetica,sans-serif;text-decoration:none;box-shadow:0 12px 28px rgba(16,29,51,.28);transition:background .2s,transform .2s;animation:whatsapp-pulse 2.4s ease-in-out infinite}
  .whatsapp-float img{width:58px;height:58px;flex:0 0 58px;object-fit:cover;border-radius:13px}
  .whatsapp-float:hover{background:#1fbd5b;transform:translateY(-2px)}

  @media (prefers-reduced-motion:reduce){.whatsapp-float{animation:none;transition:none}}
  @media (max-width:640px){.whatsapp-float{right:16px;bottom:16px;padding:8px}.whatsapp-float span{display:none}}
</style>
